<!doctype html><html lang='ko'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>앱 소개 이미지 01 · 우리 사진으로 완성하는 청첩장</title><style>:root{--ivory:#f7f2ea;--paper:#fbf8f3;--ink:#23201c;--ink-soft:#4a443d;--rose:#8a4a52;--line:#d9cfc2;--serif:'Nanum Myeongjo','AppleMyungjo','Noto Serif KR','Batang',serif;--sans:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#2a2622}body{min-height:100vh;display:flex;align-items:center;justify-content:center}.canvas{container-type:inline-size;position:relative;display:flex;flex-direction:column;width:min(100vw,calc(100vh * 1242 / 2688));aspect-ratio:1242/2688;background:var(--ivory);color:var(--ink);font-family:var(--sans);word-break:keep-all;overflow:hidden}.glow{position:absolute;width:120cqw;height:120cqw;right:-55cqw;top:-48cqw;border-radius:50%;background:radial-gradient(circle,rgba(168,99,106,.16),rgba(168,99,106,0) 65%)}.frame{position:absolute;inset:3.2cqw;border:.16cqw solid var(--line);pointer-events:none}.inner{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:11cqw 8.5cqw 8cqw}.brand{display:flex;align-items:center;gap:2.4cqw;margin:0;font-size:2.5cqw;font-weight:600;letter-spacing:.2em;color:var(--rose)}.brand::after{content:'';flex:0 0 12cqw;height:.16cqw;background:var(--rose);opacity:.6}h1{margin:5cqw 0 0;font-family:var(--serif);font-weight:400;font-size:8.6cqw;line-height:1.32;letter-spacing:-.02em}.sub{max-width:72cqw;margin:4cqw 0 0;font-size:3.3cqw;line-height:1.65;color:var(--ink-soft)}.visual{position:relative;flex:1;min-height:0;margin:8cqw 0 6cqw}.phone{position:absolute;z-index:2;aspect-ratio:9/19.5;padding:1.5cqw;background:var(--ink);border-radius:7.5cqw;box-shadow:0 4cqw 8cqw rgba(35,32,28,.22),0 .6cqw 1.6cqw rgba(35,32,28,.18)}.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:6cqw;background:var(--paper)}.p-main{top:0;bottom:0;right:0}.photo{position:absolute;z-index:1;left:0;top:10%;width:44cqw;margin:0;padding:1.4cqw;background:var(--paper);border:.16cqw solid var(--line);box-shadow:0 2cqw 5cqw rgba(35,32,28,.12)}.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.photo figcaption{margin-top:1.4cqw;font-size:2.1cqw;color:var(--ink-soft)}.aside{position:absolute;left:0;bottom:4%;width:25cqw;margin:0;font-family:var(--serif);font-size:3.4cqw;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:2cqw;list-style:none;margin:0;padding:0}.chips li{padding:1.6cqw 3.4cqw;border:.16cqw solid var(--ink);border-radius:99cqw;font-size:2.9cqw}.note{margin:5cqw 0 0;padding-top:3cqw;border-top:.16cqw solid var(--line);font-size:2.15cqw;line-height:1.6;color:var(--ink-soft)}</style></head><body><main class='canvas' aria-label='앱 소개 이미지: 우리 사진으로 완성하는 청첩장'><div class='glow' aria-hidden='true'></div><div class='frame' aria-hidden='true'></div><div class='inner'><p class='brand'>청첩장</p><h1>우리 사진으로<br>완성하는 청첩장</h1><p class='sub'>마음에 드는 디자인을 고르고, 두 사람의 사진과 문구로 바꿔 보세요.</p><div class='visual'><figure class='photo'><img src='/photos/wedding-blossom-v2.webp' alt='봄꽃 분위기의 웨딩 사진 예시'><figcaption>실사 AI 샘플 사진</figcaption></figure><p class='aside'>디자인은 그대로,<br>사진은 우리 것으로</p><div class='phone p-main'><img src='/app-intro/screenshots/template.png' alt='청첩장 표지 화면 캡처'></div></div><ul class='chips' aria-label='주요 기능'><li>디자인 선택</li><li>사진 교체</li><li>문구 수정</li></ul><p class='note'>실제 앱 화면 캡처를 포함한 마케팅 구성 이미지입니다. 사진은 실사 AI 샘플이며, 실제 청첩장에는 직접 올린 사진이 들어갑니다.</p></div></main></body></html>
