<!doctype html><html lang='ko'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>앱 소개 이미지 03 · 소중한 사람에게 링크 하나로</title><style>:root{--ivory:#f7f2ea;--paper:#fbf8f3;--ink:#23201c;--ink-soft:#4a443d;--rose:#8a4a52;--line:#d9cfc2;--serif:'Nanum Myeongjo','AppleMyungjo','Noto Serif KR','Batang',serif;--sans:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#2a2622}body{min-height:100vh;display:flex;align-items:center;justify-content:center}.canvas{container-type:inline-size;position:relative;display:flex;flex-direction:column;width:min(100vw,calc(100vh * 1242 / 2688));aspect-ratio:1242/2688;background:var(--ivory);color:var(--ink);font-family:var(--sans);word-break:keep-all;overflow:hidden}.glow{position:absolute;width:120cqw;height:120cqw;right:-50cqw;top:40%;border-radius:50%;background:radial-gradient(circle,rgba(168,99,106,.15),rgba(168,99,106,0) 65%)}.frame{position:absolute;inset:3.2cqw;border:.16cqw solid var(--line);pointer-events:none}.inner{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:11cqw 8.5cqw 8cqw}.brand{display:flex;align-items:center;gap:2.4cqw;margin:0;font-size:2.5cqw;font-weight:600;letter-spacing:.2em;color:var(--rose)}.brand::after{content:'';flex:0 0 12cqw;height:.16cqw;background:var(--rose);opacity:.6}h1{margin:5cqw 0 0;font-family:var(--serif);font-weight:400;font-size:8.6cqw;line-height:1.32;letter-spacing:-.02em}.sub{max-width:74cqw;margin:4cqw 0 0;font-size:3.3cqw;line-height:1.65;color:var(--ink-soft)}.visual{position:relative;flex:1;min-height:0;margin:8cqw 0 6cqw}.phone{position:absolute;top:0;bottom:0;right:0;aspect-ratio:9/19.5;padding:1.5cqw;background:var(--ink);border-radius:7.5cqw;box-shadow:0 4cqw 8cqw rgba(35,32,28,.22),0 .6cqw 1.6cqw rgba(35,32,28,.18)}.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:6cqw;background:var(--paper)}.list{position:absolute;left:0;top:50%;width:25cqw;margin:0;transform:translateY(-50%)}.list div{padding:3cqw 0;border-top:.16cqw solid var(--line)}.list div:last-child{border-bottom:.16cqw solid var(--line)}.list dt{font-family:var(--serif);font-size:3.4cqw;line-height:1.4}.list dd{margin:1cqw 0 0;font-size:2.4cqw;line-height:1.55;color:var(--ink-soft)}.closing{margin:0;font-family:var(--serif);font-size:3.6cqw;line-height:1.55}.note{margin:5cqw 0 0;padding-top:3cqw;border-top:.16cqw solid var(--line);font-size:2.15cqw;line-height:1.6;color:var(--ink-soft)}</style></head><body><main class='canvas' aria-label='앱 소개 이미지: 소중한 사람에게 링크 하나로'><div class='glow' aria-hidden='true'></div><div class='frame' aria-hidden='true'></div><div class='inner'><p class='brand'>청첩장</p><h1>소중한 사람에게<br>링크 하나로</h1><p class='sub'>완성한 청첩장은 공유 링크로 전해요. 받는 분은 링크에서 일정과 장소를 보고 참석 여부를 남길 수 있어요.</p><div class='visual'><dl class='list'><div><dt>지도 링크</dt><dd>예식장까지 오는 길 안내</dd></div><div><dt>참석 응답</dt><dd>참석 여부를 미리 확인</dd></div><div><dt>방명록</dt><dd>축하의 말을 한곳에</dd></div><div><dt>공개 설정</dt><dd>계좌·연락처 표시 여부 선택</dd></div></dl><div class='phone'><img src='/app-intro/screenshots/native-home.png' alt='iOS 앱 홈 화면 캡처'></div></div><p class='closing'>지금은 웹에서 바로 만들 수 있어요.</p><p class='note'>실제 앱 화면 캡처를 포함한 마케팅 구성 이미지입니다. iOS 앱은 TestFlight를 준비 중입니다. 화면 속 사진은 실사 AI 샘플이며, 실제 청첩장에는 직접 올린 사진이 들어갑니다.</p></div></main></body></html>
