name: WeddingInvitation
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3FG9QJC8WC
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 2
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 청첩장
    INFOPLIST_KEY_CFBundleDevelopmentRegion: ko
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 청첩장에 넣을 사진을 촬영하기 위해 카메라를 사용합니다.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 청첩장에 넣을 사진을 선택하기 위해 사진을 사용합니다.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 청첩장 이미지를 사진 앱에 저장합니다.
    TARGETED_DEVICE_FAMILY: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.invitehub.wedding-preview
    PRODUCT_NAME: WeddingInvitation
targets:
  WeddingInvitation:
    type: application
    platform: iOS
    sources: [App, Core, Resources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: wedding-preview-auth
            CFBundleURLSchemes: [com.invitehub.wedding-preview]
  WeddingRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RuntimeTests]
    dependencies:
      - target: WeddingInvitation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invitehub.wedding-preview.runtime-tests
        PRODUCT_NAME: WeddingRuntimeTests
        PRODUCT_MODULE_NAME: WeddingRuntimeTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeddingInvitation.app/WeddingInvitation"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WeddingInvitation:
    build:
      targets:
        WeddingInvitation: all
    test:
      targets: [WeddingRuntimeTests]
