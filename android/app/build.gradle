plugins { id 'com.android.application' }

android {
    namespace 'com.invitehub.weddingpreview'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.invitehub.weddingpreview'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // No legacy/upload signing key is reused. This produces an unsigned candidate AAB.
        }
    }
}

// Android platform APIs only; no application library dependencies or billing activation.
